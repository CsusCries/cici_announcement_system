<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d4ed8">
<title>Offline · CICI</title>
<style>
  body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px;box-sizing:border-box;
       font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f2f6ff;color:#0f1c3f;text-align:center}
  .card{background:#fff;border:1px solid #e2e8f0;border-radius:20px;padding:28px;max-width:380px}
  img{width:72px;height:72px;border-radius:18px}
  h1{font-size:22px;margin:14px 0 6px}
  p{color:#5b6b84;margin:0 0 18px}
  button{font:inherit;font-weight:700;border:0;background:#2563eb;color:#fff;padding:12px 22px;border-radius:12px;cursor:pointer;min-height:44px}
</style>
</head>
<body>
  <div class="card">
    <img src="icons/icon-192.png" alt="">
    <h1>You're offline</h1>
    <p>CICI needs an internet connection to load announcements. Check your Wi-Fi or mobile data and try again.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
