<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CICI Announcement System</title>
<style>
:root{--blue:#1d4ed8;--blue-d:#1e3a8a;--blue-600:#2563eb;--blue-100:#e0eaff;--blue-50:#f2f6ff;--white:#fff;--text:#0f1c3f;--muted:#64748b;--border:#e2e8f0;--red:#dc2626}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--blue-50);color:var(--text)}
button{font:inherit;cursor:pointer;color:inherit}
a{color:inherit;text-decoration:none}
.app{display:grid;grid-template-columns:240px minmax(0,1fr) 300px;min-height:100vh}
/* sidebar */
.side{background:linear-gradient(180deg,#f7f9ff,#eef3ff);border-right:1px solid var(--border);padding:24px 16px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh;overflow:hidden;align-self:start}
.logo{display:flex;align-items:center;gap:10px;padding:0 8px 20px}
.logo .mark{width:44px;height:44px;border-radius:50%;background:radial-gradient(circle,#fff 0 22%,var(--blue) 23% 100%);box-shadow:0 0 0 6px #dbe7ff inset}
.logo b{display:block;font-size:26px;color:var(--blue);letter-spacing:.5px;line-height:1}
.logo small{font-size:12px;color:var(--text);display:block;margin-top:4px}
.nav button{display:flex;width:100%;align-items:center;gap:14px;padding:12px 16px;border:0;background:none;border-radius:12px;color:var(--text);font-size:15px;text-align:left}
.nav button:hover{background:rgba(37,99,235,.07)}
.nav button.on{background:var(--blue-600);color:#fff;font-weight:600;box-shadow:0 6px 16px rgba(37,99,235,.25)}
.nav .ic{width:20px;height:20px;border:2px solid currentColor;border-radius:5px;opacity:.85;flex:none}
.nav .ic.round{border-radius:50%}
.nav hr{border:0;border-top:1px solid var(--border);margin:14px 8px}
.badge{margin-left:auto;background:var(--red);color:#fff;border-radius:999px;font-size:12px;padding:1px 8px;font-weight:700}
.user{margin-top:auto;position:relative}
.user button{display:flex;width:100%;align-items:center;gap:10px;padding:14px 8px;border:0;border-top:1px solid var(--border);background:none;text-align:left}
.avatar{width:40px;height:40px;border-radius:50%;background:#dbe7ff;color:var(--blue-d);display:grid;place-items:center;font-weight:700;flex:none}
.user b{display:block}.user small{color:var(--muted)}
/* main */
.main{padding:24px 28px;min-width:0}
.side,.rail{min-width:0}
.toprow{display:flex;gap:14px;align-items:center}
.search{flex:1;display:flex;align-items:center;gap:10px;background:var(--white);border:1px solid var(--border);border-radius:14px;padding:12px 18px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.search{min-width:0}
.search input{border:0;outline:0;flex:1;min-width:0;width:100%;font:inherit;background:transparent;color:var(--text)}
.search input::placeholder{color:var(--muted)}
.bell{position:relative;width:44px;height:44px;border-radius:50%;border:1px solid var(--border);background:var(--white);font-size:18px}
.bell .badge{position:absolute;top:-4px;right:-4px;margin:0;font-size:11px;padding:0 6px}
.bell .badge[hidden]{display:none}
.dropdown{position:absolute;top:52px;right:0;width:300px;background:var(--white);border:1px solid var(--border);border-radius:14px;box-shadow:0 12px 30px rgba(15,28,63,.15);padding:8px;z-index:5}
.dropdown[hidden]{display:none}
.dropdown .ni{display:block;width:100%;text-align:left;padding:10px 12px;border:0;background:none;border-radius:10px}
.dropdown .ni:hover{background:var(--blue-50)}
.dropdown .ni b{display:block}.dropdown .ni small{color:var(--muted)}
.hero{position:relative;margin-top:20px;border-radius:20px;overflow:hidden;background:linear-gradient(100deg,#1e4fd0 0%,#2f6df0 55%,#5b8ff5 100%);color:#fff;padding:34px 36px;min-height:250px}
.hero .chip{display:inline-block;background:rgba(255,255,255,.2);padding:6px 14px;border-radius:999px;font-size:13px;font-weight:600}
.hero h2{margin:22px 0 8px;font-size:40px;line-height:1.1}
.hero p{margin:0 0 20px;font-size:17px;opacity:.95;max-width:380px}
.hero .cta{display:inline-block;background:#fff;color:var(--blue-d);font-weight:700;padding:11px 20px;border:0;border-radius:10px}
.hero .dots{position:absolute;left:50%;bottom:16px;display:flex;gap:8px;transform:translateX(-50%)}
.hero .dots button{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.5);border:0;padding:0}
.hero .dots button.on{background:#fff}
.hero .bldg{position:absolute;right:250px;bottom:0;width:320px;height:110px;background:linear-gradient(#ffffff22,#ffffff11);clip-path:polygon(0 100%,0 40%,15% 40%,15% 15%,30% 15%,30% 40%,45% 40%,45% 0,60% 0,60% 40%,75% 40%,75% 20%,100% 20%,100% 100%);pointer-events:none}
.hero .mega{position:absolute;right:40px;top:40px;width:230px;height:200px;background:linear-gradient(135deg,#fff,#c9dbff);clip-path:polygon(0 35%,55% 0,100% 0,100% 100%,55% 100%,0 65%);border-radius:10px;opacity:.95;pointer-events:none}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:20px}
.qcard{background:var(--white);border:1px solid var(--border);border-radius:16px;padding:18px;display:flex;align-items:center;gap:16px;box-shadow:0 1px 2px rgba(0,0,0,.03);text-align:left}
.qcard:hover,.card:hover,.panel .it:hover{border-color:var(--blue-600)}
.qcard .ico{width:60px;height:60px;border-radius:50%;background:var(--blue-100);display:grid;place-items:center;font-size:22px;flex:none}
.qcard b{display:block;font-size:16px}.qcard small{color:var(--muted)}
.qcard .go{margin-left:auto;width:34px;height:34px;border-radius:50%;background:var(--blue-50);display:grid;place-items:center;color:var(--blue)}
.sec{display:flex;justify-content:space-between;align-items:center;margin:28px 0 14px}
.sec h3{margin:0;font-size:20px;display:flex;align-items:center;gap:10px}
.sec h3::before{content:"";width:5px;height:22px;background:var(--blue);border-radius:3px}
.linkbtn{background:none;border:0;color:var(--blue);font-weight:600;font-size:14px;padding:0}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chips button{border:1px solid var(--border);background:var(--white);padding:6px 14px;border-radius:999px;font-size:13px;font-weight:600;color:var(--muted)}
.chips button.on{background:var(--blue-600);border-color:var(--blue-600);color:#fff}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.card{background:var(--white);border:1px solid var(--border);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.card .top{display:flex;justify-content:space-between;align-items:center;padding:14px 14px 0}
.tag{background:var(--blue-100);color:var(--blue-d);padding:4px 14px;border-radius:999px;font-weight:600;font-size:13px}
.tag.act{background:#d9f5ee;color:#0f6b55}
.tag.exam{background:#e3ebff;color:#1e3a8a}
.pin{color:var(--blue);font-size:13px;font-weight:600}
.img{margin:12px 14px 0;height:128px;border-radius:12px;background:linear-gradient(135deg,#d7e6ff,#9dbcf3)}
.img.green{background:linear-gradient(135deg,#2f7d4f,#8cc48f)}
.img.paper{background:linear-gradient(135deg,#eef2fb,#c8d3ea)}
.card .body{padding:14px;flex:1}
.card h4{margin:0 0 8px;font-size:16px}
.meta{color:var(--muted);font-size:13px;display:flex;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.card p{margin:0 0 12px;color:#334155}
.card .link{color:var(--blue);font-weight:600;margin:0 14px 14px;padding:0;background:none;border:0;text-align:left}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:32px;background:var(--white);border:1px dashed var(--border);border-radius:16px}
/* right */
.rail{padding:24px 22px 24px 0;display:flex;flex-direction:column;gap:16px;position:sticky;top:0;height:100vh;overflow:hidden;align-self:start}
.panel{background:var(--white);border:1px solid var(--border);border-radius:16px;padding:14px 16px}
.panel header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.panel header b{font-size:16px;display:flex;gap:10px;align-items:center}
.panel header .linkbtn{font-size:13px}
.calnav{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-weight:700}
.calnav button{background:none;border:0;font-size:18px;color:var(--blue);padding:0 6px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;gap:2px 0;font-size:13px}
.cal .dow{color:var(--muted);font-size:12px}
.cal button{position:relative;width:30px;height:30px;margin:auto;border:0;border-radius:50%;background:none;font:inherit;color:var(--text)}
.cal button:hover{background:var(--blue-50)}
.cal button.hl{background:var(--blue-100)}
.cal button.sel{background:var(--blue);color:#fff;font-weight:700}
.cal button.dot::after{content:"";position:absolute;bottom:2px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--blue)}
.cal button.sel.dot::after{background:#fff}
.cal button.blank{visibility:hidden}
.up{display:flex;flex-direction:column}
.up .it{display:grid;grid-template-columns:14px 1fr auto;gap:10px;padding:8px;margin:0 -8px;position:relative;align-items:start;background:none;border:0;border-radius:10px;text-align:left;width:calc(100% + 16px)}
.up .it > span:first-child{width:10px;height:10px;border-radius:50%;background:var(--blue);margin-top:6px}
.up .it:not(:last-child)::after{content:"";position:absolute;left:12px;top:26px;bottom:-12px;width:2px;background:var(--blue-100)}
.up .it b{display:block}
.up .it span{font-size:13px;color:var(--muted)}
.up .none{color:var(--muted);padding:8px 0}
.pill{font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--blue-100);color:var(--blue-d);white-space:nowrap}
.pill.exam{background:#e3ebff}.pill.act{background:#d9f5ee;color:#0f6b55}
footer{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-top:1px solid var(--border);padding:18px 0 4px;margin-top:28px;color:var(--muted);font-size:13px}
footer b{color:var(--blue)}
/* dialog & toast */
dialog{border:0;border-radius:18px;padding:0;width:min(460px,calc(100% - 32px));color:var(--text)}
dialog::backdrop{background:rgba(15,28,63,.45)}
dialog .box{padding:24px}
dialog h3{margin:8px 0 6px;font-size:20px}
dialog p{color:#334155}
dialog .acts{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}
.btn{border:1px solid var(--border);background:var(--white);padding:10px 16px;border-radius:10px;font-weight:600}
.btn.primary{background:var(--blue-600);border-color:var(--blue-600);color:#fff}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--blue-d);color:#fff;padding:12px 18px;border-radius:12px;opacity:0;pointer-events:none;transition:.25s;z-index:20;max-width:90vw}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* adaptive */
.cards{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.quick{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
@media (max-width:1280px){
  .app{grid-template-columns:200px minmax(0,1fr) 260px}
  .main{padding:20px}
  .hero{padding:26px}
  .hero h2{font-size:32px}
  .hero .bldg{right:200px}
  .hero .mega{width:180px;height:160px}
}
@media (max-width:1100px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:sticky;top:0;z-index:5;height:auto;flex-direction:row;align-items:center;gap:12px;padding:10px 16px;overflow:visible;border-right:0;border-bottom:1px solid var(--border)}
  .logo{padding:0 8px 0 0}
  .logo small{display:none}
  .logo b{font-size:20px}
  .nav{display:flex;gap:4px;overflow-x:auto;flex:1;min-width:0}
  .nav button{white-space:nowrap;width:auto;padding:8px 12px;font-size:14px}
  .nav hr{display:none}
  .user{display:none}
  .rail{position:static;height:auto;overflow:visible;padding:0 20px 20px;display:grid;grid-template-columns:1fr 1fr;align-items:start;gap:16px}
  .main{padding:20px}
  .toprow{position:relative}
  footer{margin-top:20px}
}
@media (max-width:760px){
  .rail{grid-template-columns:1fr;padding:0 16px 16px}
  .cards{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
  .hero{min-height:200px;padding:22px}
  .hero h2{font-size:28px;margin-top:14px}
  .hero p{font-size:15px}
  .hero .bldg,.hero .mega{display:none}
  .chips{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px}
  .chips button{white-space:nowrap}
}
@media (max-width:560px){
  .side{padding:8px 12px}
  .logo{display:none}
  .main{padding:14px}
  .toprow{gap:10px}
  .bell{width:40px;height:40px;flex:none}
  .search{padding:10px 14px}
  .search input{font-size:16px}
  .cards{grid-template-columns:1fr}
  .quick{grid-template-columns:1fr}
  .qcard{padding:14px}
  .qcard .ico{width:48px;height:48px;font-size:19px}
  .sec h3{font-size:18px}
  .dropdown{width:min(300px,calc(100vw - 40px));right:0}
  footer{flex-direction:column;align-items:flex-start;gap:6px}
  .hero .cta{width:100%;text-align:center}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="logo"><div class="mark"></div><div><b>CICI</b><small>Announcement<br>System</small></div></div>
    <nav class="nav" id="nav">
      <button class="on" data-view="all"><span class="ic"></span>Home</button>
      <button data-view="event"><span class="ic"></span>Events</button>
      <button data-view="activity"><span class="ic"></span>Activities</button>
      <button data-view="exam"><span class="ic"></span>Exams</button>
      <hr>
      <button id="navNotif"><span class="ic round"></span>Notifications <span class="badge" id="navBadge">2</span></button>
      <button id="navSettings"><span class="ic round"></span>Settings</button>
    </nav>
    <div class="user">
      <button id="userBtn"><div class="avatar">PA</div><div><b>Paul Abian</b><small>Student ▾</small></div></button>
    </div>
  </aside>

  <main class="main">
    <div class="toprow" style="display:flex;gap:14px;align-items:center;position:relative">
      <label class="search"><span aria-hidden="true">🔍</span><input id="search" placeholder="Search announcements, events..." aria-label="Search"></label>
      <button class="bell" id="bellBtn" aria-label="Notifications">🔔<span class="badge" id="bellBadge">2</span></button>
      <div class="dropdown" id="notifMenu" hidden></div>
    </div>

    <section class="hero" id="hero">
      <span class="chip" id="heroChip">📢 Latest Announcement</span>
      <h2 id="heroTitle">Welcome to CICI!</h2>
      <p id="heroText">Stay updated with the latest events, activities, and exams.</p>
      <button class="cta" id="heroCta">View All Announcements →</button>
      <div class="bldg"></div>
      <div class="mega"></div>
      <div class="dots" id="heroDots"></div>
    </section>

    <section class="quick">
      <button class="qcard" data-view="event"><div class="ico">📅</div><div><b>Events</b><small>Check upcoming events</small></div><span class="go">›</span></button>
      <button class="qcard" data-view="activity"><div class="ico">🏆</div><div><b>Activities</b><small>Join and participate</small></div><span class="go">›</span></button>
      <button class="qcard" data-view="exam"><div class="ico">📄</div><div><b>Exams</b><small>View exam schedules</small></div><span class="go">›</span></button>
    </section>

    <div class="sec"><h3 id="updatesTitle">Latest Updates</h3><button class="linkbtn" data-view="all">See all →</button></div>
    <div class="chips" id="chips">
      <button class="on" data-view="all">All</button>
      <button data-view="event">Events</button>
      <button data-view="activity">Activities</button>
      <button data-view="exam">Exams</button>
    </div>
    <section class="cards" id="cards"></section>

    <footer>
    <span><b>CICI</b> &nbsp;•&nbsp; Connect. Learn. Participate.</span>
    <span>Stay informed. Stay ahead. ♡</span>
    </footer>
  </main>

  <aside class="rail">
    <div class="panel">
      <header><b>📅 Academic Calendar</b><button class="linkbtn" id="todayBtn">Today</button></header>
      <div class="calnav"><button id="prevMonth" aria-label="Previous month">‹</button><span id="monthLabel"></span><button id="nextMonth" aria-label="Next month">›</button></div>
      <div class="cal" id="cal"></div>
    </div>
    <div class="panel">
      <header><b>🕒 Upcoming</b><button class="linkbtn" data-view="all">See all →</button></header>
      <div class="up" id="upcoming"></div>
    </div>
  </aside>

</div>

<dialog id="detail"><div class="box" id="detailBody"></div></dialog>
<div id="toast" role="status" aria-live="polite"></div>

<script>
/* ---------- data ---------- */
const TYPE = { event: 'Events', activity: 'Activities', exam: 'Exams' };
const TAG_CLASS = { event: '', activity: 'act', exam: 'exam' };
const PILL = { event: 'Event', activity: 'Activity', exam: 'Exam' };
const IMG = { event: '', activity: 'green', exam: 'paper' };
const CTA = { event: 'Register Now', activity: 'Join Activity', exam: 'View Details' };

const data = [
  { id: 1, type: 'event', title: 'CICI Week 2026', date: '2026-11-15', end: '2026-11-21', where: 'Main Campus', pinned: true,
    body: 'A week of fun, learning, and community!' },
  { id: 2, type: 'activity', title: 'Green Campus Initiative', date: '2026-11-10', end: '2026-11-30', where: 'Campus Grounds',
    body: 'Join our tree planting activity.' },
  { id: 3, type: 'exam', title: 'Midterm Examination', date: '2026-11-20', where: 'Online',
    body: 'Coverage: Modules 1–5.' },
  { id: 4, type: 'activity', title: 'Activity Deadline', date: '2026-11-30', where: 'Student Affairs Office',
    body: 'Last day to submit your activity sign-up form.' },
  { id: 5, type: 'event', title: 'Freshmen Orientation', date: '2026-11-09', where: 'Auditorium',
    body: 'Welcome session, campus tour and club sign-ups.' },
  { id: 6, type: 'exam', title: 'Data Structures Quiz', date: '2026-11-12', where: 'Room 105',
    body: 'Chapters 4–6. Bring your student ID.' },
];

const heroSlides = [
  { chip: '📢 Latest Announcement', title: 'Welcome to CICI!', text: 'Stay updated with the latest events, activities, and exams.', cta: 'View All Announcements →', view: 'all' },
  { chip: '📅 Event', title: 'CICI Week is Coming', text: 'A week of fun, learning, and community starts November 15.', cta: 'See Events →', view: 'event' },
  { chip: '📄 Exam', title: 'Midterms Are Near', text: 'Check the exam schedule and prepare early.', cta: 'View Exams →', view: 'exam' },
];

const notifications = [
  { title: 'Midterm Examination', sub: 'Nov 20 · Coverage: Modules 1–5' },
  { title: 'CICI Week 2026 starts soon', sub: 'Nov 15 · Main Campus' },
  { title: 'Activity deadline reminder', sub: 'Nov 30 · Sign up before the deadline' },
];

/* ---------- state ---------- */
let view = 'all';
let query = '';
let selectedDay = null;
let heroIndex = 0;
let calYear = 2026, calMonth = 10; // November 2026 (0-indexed month)
let notifUnread = notifications.length;

/* ---------- helpers ---------- */
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const iso = (y, m, d) => `${y}-${String(m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
const fmtDate = (s) => new Date(s + 'T00:00:00').toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
const fmtRange = (a) => a.end ? `${fmtDate(a.date)} – ${fmtDate(a.end)}` : fmtDate(a.date);
const monthName = (y, m) => new Date(y, m, 1).toLocaleDateString(undefined, { month: 'long', year: 'numeric' });

let toastTimer;
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

function openDetail(a) {
  $('#detailBody').innerHTML = `
    <span class="pill ${a.type === 'activity' ? 'act' : a.type === 'exam' ? 'exam' : ''}">${PILL[a.type]}</span>
    <h3>${esc(a.title)}</h3>
    <div class="meta"><span>📅 ${fmtRange(a)}</span><span>📍 ${esc(a.where)}</span></div>
    <p>${esc(a.body)}</p>
    <div class="acts">
      <button class="btn" data-close>Close</button>
      <button class="btn primary" data-cta="${a.id}">${CTA[a.type]}</button>
    </div>`;
  $('#detail').showModal();
}

/* ---------- hero ---------- */
function renderHero() {
  const s = heroSlides[heroIndex];
  $('#heroChip').textContent = s.chip;
  $('#heroTitle').textContent = s.title;
  $('#heroText').textContent = s.text;
  $('#heroCta').textContent = s.cta;
  $('#heroCta').dataset.view = s.view;
  $('#heroDots').innerHTML = heroSlides.map((_, i) =>
    `<button class="${i === heroIndex ? 'on' : ''}" data-dot="${i}" aria-label="Slide ${i + 1}"></button>`).join('');
}

/* ---------- cards ---------- */
function filtered() {
  const q = query.trim().toLowerCase();
  return data
    .filter((a) => view === 'all' || a.type === view)
    .filter((a) => !q || (a.title + ' ' + a.body + ' ' + a.where).toLowerCase().includes(q))
    .filter((a) => !selectedDay || a.date <= selectedDay && (a.end || a.date) >= selectedDay)
    .sort((a, b) => (b.pinned - a.pinned) || a.date.localeCompare(b.date));
}

function renderCards() {
  const list = filtered();
  $('#updatesTitle').textContent = view === 'all' ? 'Latest Updates' : TYPE[view];
  document.querySelectorAll('#chips button').forEach((b) => b.classList.toggle('on', b.dataset.view === view));
  document.querySelectorAll('#nav button[data-view]').forEach((b) => b.classList.toggle('on', b.dataset.view === view));
  $('#cards').innerHTML = list.length ? list.map((a) => `
    <article class="card">
      <div class="top"><span class="tag ${TAG_CLASS[a.type]}">${TYPE[a.type]}</span>${a.pinned ? '<span class="pin">📌 Pinned</span>' : ''}</div>
      <div class="img ${IMG[a.type]}"></div>
      <div class="body">
        <h4>${esc(a.title)}</h4>
        <div class="meta"><span>📅 ${fmtRange(a)}</span><span>📍 ${esc(a.where)}</span></div>
        <p>${esc(a.body)}</p>
      </div>
      <button class="link" data-detail="${a.id}">${CTA[a.type]} →</button>
    </article>`).join('')
    : `<div class="empty">No ${view === 'all' ? 'announcements' : TYPE[view].toLowerCase()} match your search.</div>`;
}

/* ---------- calendar ---------- */
function renderCal() {
  $('#monthLabel').textContent = monthName(calYear, calMonth);
  const first = new Date(calYear, calMonth, 1).getDay();
  const days = new Date(calYear, calMonth + 1, 0).getDate();
  let html = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].map((d) => `<span class="dow">${d}</span>`).join('');
  for (let i = 0; i < first; i++) html += '<button class="blank" disabled></button>';
  for (let d = 1; d <= days; d++) {
    const key = iso(calYear, calMonth, d);
    const has = data.some((a) => a.date <= key && (a.end || a.date) >= key);
    const cls = [selectedDay === key ? 'sel' : '', has ? 'dot' : ''].join(' ').trim();
    html += `<button class="${cls}" data-day="${key}" aria-label="${key}">${d}</button>`;
  }
  $('#cal').innerHTML = html;
}

/* ---------- upcoming ---------- */
function renderUpcoming() {
  const today = iso(2026, 10, 4); // mock "today" to match the design
  let list = data.filter((a) => (a.end || a.date) >= today).sort((a, b) => a.date.localeCompare(b.date));
  if (selectedDay) list = data.filter((a) => a.date <= selectedDay && (a.end || a.date) >= selectedDay);
  $('#upcoming').innerHTML = list.length ? list.slice(0, 3).map((a) => `
    <button class="it" data-detail="${a.id}">
      <span></span>
      <div><b>${fmtRange(a)}</b><span>${esc(a.title)}</span></div>
      <span class="pill ${a.type === 'activity' ? 'act' : a.type === 'exam' ? 'exam' : ''}">${PILL[a.type]}</span>
    </button>`).join('')
    : '<p class="none">Nothing scheduled for this day.</p>';
}

/* ---------- notifications ---------- */
function renderNotif() {
  $('#navBadge').textContent = notifUnread;
  $('#navBadge').hidden = !notifUnread;
  $('#bellBadge').textContent = notifUnread;
  $('#bellBadge').hidden = !notifUnread;
  $('#notifMenu').innerHTML = notifications.map((n) =>
    `<button class="ni"><b>${esc(n.title)}</b><small>${esc(n.sub)}</small></button>`).join('')
    + `<button class="ni" data-mark-read style="text-align:center;color:var(--blue);font-weight:600">Mark all as read</button>`;
}

function renderAll() { renderHero(); renderCards(); renderCal(); renderUpcoming(); renderNotif(); }

function setView(v) {
  view = v;
  selectedDay = null;
  renderAll();
  $('#cards').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

/* ---------- events ---------- */
document.addEventListener('click', (e) => {
  const t = e.target;
  const nav = t.closest('[data-view]');
  if (nav) { setView(nav.dataset.view); return; }

  const dot = t.closest('[data-dot]');
  if (dot) { heroIndex = +dot.dataset.dot; renderHero(); return; }

  const detail = t.closest('[data-detail]');
  if (detail) { openDetail(data.find((a) => a.id == detail.dataset.detail)); return; }

  const cta = t.closest('[data-cta]');
  if (cta) {
    const a = data.find((x) => x.id == cta.dataset.cta);
    $('#detail').close();
    toast(a.type === 'exam' ? `Opened details for ${a.title}` : `You're in: ${a.title}`);
    return;
  }

  const day = t.closest('[data-day]');
  if (day) {
    selectedDay = selectedDay === day.dataset.day ? null : day.dataset.day;
    renderCal(); renderUpcoming(); renderCards();
    return;
  }

  if (t.closest('[data-close]')) { $('#detail').close(); return; }

  if (t.closest('[data-mark-read]')) {
    notifUnread = 0; renderNotif(); toast('All notifications marked as read');
    return;
  }

  if (t.closest('#bellBtn')) {
    const m = $('#notifMenu');
    m.hidden = !m.hidden;
    if (!m.hidden) { notifUnread = 0; renderNotif(); }
    return;
  }
  if (!t.closest('#notifMenu')) $('#notifMenu').hidden = true;
});

$('#heroCta').addEventListener('click', () => setView($('#heroCta').dataset.view));
$('#navNotif').addEventListener('click', () => { $('#notifMenu').hidden = false; notifUnread = 0; renderNotif(); $('#bellBtn').scrollIntoView({ behavior: 'smooth' }); });
$('#navSettings').addEventListener('click', () => toast('Settings are coming soon'));
$('#userBtn').addEventListener('click', () => toast('Signed in as Paul Abian (student)'));
$('#todayBtn').addEventListener('click', () => {
  calYear = 2026; calMonth = 10; selectedDay = iso(2026, 10, 4); renderAll();
});
$('#prevMonth').addEventListener('click', () => {
  calMonth--; if (calMonth < 0) { calMonth = 11; calYear--; } renderCal();
});
$('#nextMonth').addEventListener('click', () => {
  calMonth++; if (calMonth > 11) { calMonth = 0; calYear++; } renderCal();
});
$('#search').addEventListener('input', (e) => { query = e.target.value; renderCards(); });
$('#detail').addEventListener('click', (e) => { if (e.target.id === 'detail') $('#detail').close(); });

setInterval(() => { heroIndex = (heroIndex + 1) % heroSlides.length; renderHero(); }, 6000);

renderAll();
</script>
</body>
</html>
