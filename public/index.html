<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CICI Announcements</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar">
  <h1>📣 CICI Announcements</h1>
  <button id="newBtn" class="btn primary">+ New announcement</button>
</header>

<main class="container">
  <section class="toolbar">
    <input id="search" type="search" placeholder="Search announcements…" aria-label="Search">
    <select id="filterCategory" aria-label="Filter by category">
      <option value="">All categories</option>
      <option>General</option><option>Event</option><option>Urgent</option><option>Update</option>
    </select>
    <select id="filterPriority" aria-label="Filter by priority">
      <option value="">All priorities</option>
      <option value="high">High</option><option value="normal">Normal</option><option value="low">Low</option>
    </select>
  </section>
  <p id="count" class="muted"></p>
  <ul id="list" class="list"></ul>
  <p id="empty" class="empty" hidden>No announcements yet. Create the first one!</p>
</main>

<dialog id="dialog">
  <form id="form" method="dialog">
    <h2 id="formTitle">New announcement</h2>
    <label>Title<input name="title" required maxlength="120"></label>
    <label>Message<textarea name="body" rows="5" required></textarea></label>
    <div class="row">
      <label>Category
        <select name="category"><option>General</option><option>Event</option><option>Urgent</option><option>Update</option></select>
      </label>
      <label>Priority
        <select name="priority"><option value="normal">Normal</option><option value="high">High</option><option value="low">Low</option></select>
      </label>
    </div>
    <label>Author<input name="author" placeholder="Optional"></label>
    <label class="check"><input type="checkbox" name="pinned"> Pin to top</label>
    <div class="actions">
      <button type="button" id="cancelBtn" class="btn">Cancel</button>
      <button type="submit" class="btn primary">Publish</button>
    </div>
  </form>
</dialog>

<script src="app.js"></script>
</body>
</html>
