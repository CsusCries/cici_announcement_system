<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CICI Announcement System</title>
<style>
:root{--blue:#1d4ed8;--blue-d:#1e3a8a;--blue-600:#2563eb;--blue-100:#e0eaff;--blue-50:#f2f6ff;--white:#fff;--text:#0f1c3f;--muted:#64748b;--border:#e2e8f0;--red:#dc2626}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--blue-50);color:var(--text)}
button{font:inherit;cursor:pointer;color:inherit}
a{color:inherit;text-decoration:none}
.app{display:grid;grid-template-columns:240px minmax(0,1fr) 300px;min-height:100vh}
/* sidebar */
.side{background:linear-gradient(180deg,#f7f9ff,#eef3ff);border-right:1px solid var(--border);padding:24px 16px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh;height:100dvh;overflow:hidden;align-self:start}
.logo{display:flex;align-items:center;gap:10px;padding:0 8px 20px}
.logo .mark{width:44px;height:44px;border-radius:50%;background:radial-gradient(circle,#fff 0 22%,var(--blue) 23% 100%);box-shadow:0 0 0 6px #dbe7ff inset}
.logo b{display:block;font-size:26px;color:var(--blue);letter-spacing:.5px;line-height:1}
.logo small{font-size:12px;color:var(--text);display:block;margin-top:4px}
.nav button{display:flex;width:100%;align-items:center;gap:14px;padding:12px 16px;border:0;background:none;border-radius:12px;color:var(--text);font-size:15px;text-align:left}
.nav button:hover{background:rgba(37,99,235,.07)}
.nav button.on{background:var(--blue-600);color:#fff;font-weight:600;box-shadow:0 6px 16px rgba(37,99,235,.25)}
.nav .ic{width:22px;height:22px;flex:none;opacity:.9}
.nav hr{border:0;border-top:1px solid var(--border);margin:14px 8px}
.badge{margin-left:auto;background:var(--red);color:#fff;border-radius:999px;font-size:12px;padding:1px 8px;font-weight:700}
.user{margin-top:auto;position:relative}
.user button{display:flex;width:100%;align-items:center;gap:10px;padding:14px 8px;border:0;border-top:1px solid var(--border);background:none;text-align:left}
.avatar{width:40px;height:40px;border-radius:50%;background:#dbe7ff;color:var(--blue-d);display:grid;place-items:center;font-weight:700;flex:none}
.user b{display:block}.user small{color:var(--muted)}
/* main */
.main{padding:24px 28px;min-width:0}
.side,.rail{min-width:0}
.toprow{display:flex;gap:14px;align-items:center}
.search{flex:1;display:flex;align-items:center;gap:10px;background:var(--white);border:1px solid var(--border);border-radius:14px;padding:12px 18px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.search{min-width:0}
.search input{border:0;outline:0;flex:1;min-width:0;width:100%;font:inherit;background:transparent;color:var(--text)}
.search input::placeholder{color:var(--muted)}
.bell{position:relative;width:44px;height:44px;border-radius:50%;border:1px solid var(--border);background:var(--white);font-size:18px}
.bell .badge{position:absolute;top:-4px;right:-4px;margin:0;font-size:11px;padding:0 6px}
.bell .badge[hidden]{display:none}
.dropdown{position:absolute;top:52px;right:0;width:300px;background:var(--white);border:1px solid var(--border);border-radius:14px;box-shadow:0 12px 30px rgba(15,28,63,.15);padding:8px;z-index:5}
.dropdown[hidden]{display:none}
.dropdown .ni{display:block;width:100%;text-align:left;padding:10px 12px;border:0;background:none;border-radius:10px}
.dropdown .ni:hover{background:var(--blue-50)}
.dropdown .ni b{display:block}.dropdown .ni small{color:var(--muted)}
.hero{position:relative;margin-top:20px;border-radius:20px;overflow:hidden;background:linear-gradient(100deg,#1e4fd0 0%,#2f6df0 55%,#5b8ff5 100%);color:#fff;padding:34px 36px;min-height:250px}
.hero .chip{display:inline-block;background:rgba(255,255,255,.2);padding:6px 14px;border-radius:999px;font-size:13px;font-weight:600}
.hero h2{margin:22px 0 8px;font-size:40px;line-height:1.1}
.hero p{margin:0 0 20px;font-size:17px;opacity:.95;max-width:380px}
.hero .cta{display:inline-block;background:#fff;color:var(--blue-d);font-weight:700;padding:11px 20px;border:0;border-radius:10px}
.hero .dots{position:absolute;left:50%;bottom:16px;display:flex;gap:8px;transform:translateX(-50%)}
.hero .dots button{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.5);border:0;padding:0}
.hero .dots button.on{background:#fff}
.hero .bldg{position:absolute;right:250px;bottom:0;width:320px;height:110px;background:linear-gradient(#ffffff22,#ffffff11);clip-path:polygon(0 100%,0 40%,15% 40%,15% 15%,30% 15%,30% 40%,45% 40%,45% 0,60% 0,60% 40%,75% 40%,75% 20%,100% 20%,100% 100%);pointer-events:none}
.hero .mega{position:absolute;right:40px;top:40px;width:230px;height:200px;background:linear-gradient(135deg,#fff,#c9dbff);clip-path:polygon(0 35%,55% 0,100% 0,100% 100%,55% 100%,0 65%);border-radius:10px;opacity:.95;pointer-events:none}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:20px}
.qcard{background:var(--white);border:1px solid var(--border);border-radius:16px;padding:18px;display:flex;align-items:center;gap:16px;box-shadow:0 1px 2px rgba(0,0,0,.03);text-align:left}
.qcard:hover,.card:hover,.panel .it:hover{border-color:var(--blue-600)}
.qcard .ico{width:60px;height:60px;border-radius:50%;background:var(--blue-100);display:grid;place-items:center;font-size:22px;flex:none}
.qcard b{display:block;font-size:16px}.qcard small{color:var(--muted)}
.qcard .go{margin-left:auto;width:34px;height:34px;border-radius:50%;background:var(--blue-50);display:grid;place-items:center;color:var(--blue)}
.sec{display:flex;justify-content:space-between;align-items:center;margin:28px 0 14px}
.sec h3{margin:0;font-size:20px;display:flex;align-items:center;gap:10px}
.sec h3::before{content:"";width:5px;height:22px;background:var(--blue);border-radius:3px}
.linkbtn{background:none;border:0;color:var(--blue);font-weight:600;font-size:14px;padding:0}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chips button{border:1px solid var(--border);background:var(--white);padding:6px 14px;border-radius:999px;font-size:13px;font-weight:600;color:var(--muted)}
.chips button.on{background:var(--blue-600);border-color:var(--blue-600);color:#fff}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.card{background:var(--white);border:1px solid var(--border);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.card .top{display:flex;justify-content:space-between;align-items:center;padding:14px 14px 0}
.tag{background:var(--blue-100);color:var(--blue-d);padding:4px 14px;border-radius:999px;font-weight:600;font-size:13px}
.tag.act{background:#d9f5ee;color:#0f6b55}
.tag.exam{background:#e3ebff;color:#1e3a8a}
.pin{color:var(--blue);font-size:13px;font-weight:600}
.img{margin:12px 14px 0;height:128px;border-radius:12px;background:linear-gradient(135deg,#d7e6ff,#9dbcf3)}
.img.green{background:linear-gradient(135deg,#2f7d4f,#8cc48f)}
.img.paper{background:linear-gradient(135deg,#eef2fb,#c8d3ea)}
.card .body{padding:14px;flex:1}
.card h4{margin:0 0 8px;font-size:16px}
.meta{color:var(--muted);font-size:13px;display:flex;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.card p{margin:0 0 12px;color:#334155}
.card .link{color:var(--blue);font-weight:600;margin:0 14px 14px;padding:0;background:none;border:0;text-align:left}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:32px;background:var(--white);border:1px dashed var(--border);border-radius:16px}
/* right */
.rail{padding:24px 22px 24px 0;display:flex;flex-direction:column;gap:16px;position:sticky;top:0;height:100vh;height:100dvh;overflow:hidden;align-self:start}
.panel{background:var(--white);border:1px solid var(--border);border-radius:16px;padding:14px 16px}
.panel header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.panel header b{font-size:16px;display:flex;gap:10px;align-items:center}
.panel header .linkbtn{font-size:13px}
.calnav{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-weight:700}
.calnav button{background:none;border:0;font-size:18px;color:var(--blue);padding:0 6px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;gap:2px 0;font-size:13px}
.cal .dow{color:var(--muted);font-size:12px}
.cal button{position:relative;width:30px;height:30px;margin:auto;border:0;border-radius:50%;background:none;font:inherit;color:var(--text)}
.cal button:hover{background:var(--blue-50)}
.cal button.hl{background:var(--blue-100)}
.cal button.sel{background:var(--blue);color:#fff;font-weight:700}
.cal button.dot::after{content:"";position:absolute;bottom:2px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--blue)}
.cal button.sel.dot::after{background:#fff}
.cal button.blank{visibility:hidden}
.up{display:flex;flex-direction:column}
.up .it{display:grid;grid-template-columns:14px 1fr auto;gap:10px;padding:8px;margin:0 -8px;position:relative;align-items:start;background:none;border:0;border-radius:10px;text-align:left;width:calc(100% + 16px)}
.up .it > span:first-child{width:10px;height:10px;border-radius:50%;background:var(--blue);margin-top:6px}
.up .it:not(:last-child)::after{content:"";position:absolute;left:12px;top:26px;bottom:-12px;width:2px;background:var(--blue-100)}
.up .it b{display:block}
.up .it span{font-size:13px;color:var(--muted)}
.up .none{color:var(--muted);padding:8px 0}
.pill{font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--blue-100);color:var(--blue-d);white-space:nowrap}
.pill.exam{background:#e3ebff}.pill.act{background:#d9f5ee;color:#0f6b55}
footer{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-top:1px solid var(--border);padding:18px 0 4px;margin-top:28px;color:var(--muted);font-size:13px}
footer b{color:var(--blue)}
/* dialog & toast */
dialog{border:0;border-radius:18px;padding:0;width:min(460px,calc(100% - 32px));color:var(--text)}
dialog::backdrop{background:rgba(15,28,63,.45)}
dialog .box{padding:24px}
dialog h3{margin:8px 0 6px;font-size:20px}
dialog p{color:#334155}
dialog .acts{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}
.btn{border:1px solid var(--border);background:var(--white);padding:10px 16px;border-radius:10px;font-weight:600}
.btn.primary{background:var(--blue-600);border-color:var(--blue-600);color:#fff}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--blue-d);color:#fff;padding:12px 18px;border-radius:12px;opacity:0;pointer-events:none;transition:.25s;z-index:20;max-width:90vw}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* adaptive */
.cards{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.quick{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
@media (max-width:1280px){
  .app{grid-template-columns:200px minmax(0,1fr) 260px}
  .main{padding:20px}
  .hero{padding:26px}
  .hero h2{font-size:32px}
  .hero .bldg{right:200px}
  .hero .mega{width:180px;height:160px}
}
@media (max-width:1100px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:sticky;top:0;z-index:5;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:10px 16px;overflow:visible;border-right:0;border-bottom:1px solid var(--border)}
  .logo{padding:0 8px 0 0}
  .logo small{display:none}
  .logo b{font-size:20px}
  .nav{display:flex;flex-wrap:wrap;gap:4px;flex:1;min-width:0}
  .nav button{width:auto;padding:8px 12px;font-size:14px}
  .nav hr{display:none}
  .user{display:none}
  .rail{position:static;height:auto;overflow:visible;padding:0 20px 20px;display:grid;grid-template-columns:1fr 1fr;align-items:start;gap:16px}
  .main{padding:20px}
  .toprow{position:relative}
  footer{margin-top:20px}
}
@media (max-width:760px){
  .rail{grid-template-columns:1fr;padding:0 16px 16px}
  .cards{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
  .hero{min-height:200px;padding:22px}
  .hero h2{font-size:28px;margin-top:14px}
  .hero p{font-size:15px}
  .hero .bldg,.hero .mega{display:none}
  .chips{flex-wrap:wrap}
}
@media (max-width:560px){
  .side{padding:8px 12px}
  .logo{display:none}
  .main{padding:14px}
  .toprow{gap:10px}
  .bell{width:40px;height:40px;flex:none}
  .search{padding:10px 14px}
  .search input{font-size:16px}
  .cards{grid-template-columns:1fr}
  .quick{grid-template-columns:1fr}
  .qcard{padding:14px}
  .qcard .ico{width:48px;height:48px;font-size:19px}
  .sec h3{font-size:18px}
  .dropdown{width:min(300px,calc(100vw - 40px));right:0}
  footer{flex-direction:column;align-items:flex-start;gap:6px}
  .hero .cta{width:100%;text-align:center}
}

/* added: actions, filters, forms */
.newbtn{white-space:nowrap;flex:none}
.avbtn{display:none;width:44px;height:44px;border-radius:50%;border:0;background:#dbe7ff;color:var(--blue-d);font-weight:700;flex:none}
.secR{display:flex;gap:12px;align-items:center}
.sort{font:inherit;font-size:13px;border:1px solid var(--border);border-radius:8px;padding:6px 8px;background:var(--white);color:var(--text)}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:-4px 0 14px}
.filters[hidden]{display:none}
.fchip{background:var(--blue-100);color:var(--blue-d);border:0;border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600}
.card .top .r{display:flex;align-items:center;gap:8px}
.star{background:none;border:0;font-size:20px;line-height:1;color:var(--blue);padding:2px 4px;border-radius:6px}
.star:hover{background:var(--blue-50)}
.titlebtn{background:none;border:0;padding:0;font:inherit;font-weight:700;text-align:left;color:inherit;cursor:pointer}
.titlebtn:hover{color:var(--blue)}
.card .foot{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:0 14px 14px}
.card .foot .btn{padding:7px 12px;font-size:13px}
.btn.done{background:#e7f6ee;border-color:#bfe6cf;color:#0f6b55}
.btn.danger{color:var(--red);border-color:#f3c9c9}
.mine{font-size:12px;color:var(--muted)}
.cal button.today{box-shadow:inset 0 0 0 2px var(--blue)}
.cal button.sel.today{box-shadow:none}
.up .it b{white-space:nowrap}
dialog .acts{flex-wrap:wrap}
dialog .acts .sp{flex:1}
.fld{display:grid;gap:4px;font-size:13px;font-weight:600;color:var(--muted);margin-top:12px}
.fld input,.fld select,.fld textarea{font:inherit;font-size:15px;font-weight:400;color:var(--text);border:1px solid var(--border);border-radius:10px;padding:9px 11px;background:var(--white);width:100%}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chk{display:flex;align-items:center;gap:8px;margin-top:12px;font-weight:600}
.err{color:var(--red);font-size:13px;min-height:18px;margin-top:8px}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border)}
.setrow small{display:block;color:var(--muted)}
.setrow input{width:20px;height:20px}
#profileMenu{position:fixed;top:auto;right:auto;width:240px}
.compact .img{display:none}
.nohero .hero{display:none}
.nohero .quick{margin-top:20px}
@media (max-width:1100px){.avbtn{display:grid;place-items:center}}
@media (max-width:560px){.newbtn{padding:10px 12px}.newbtn .lbl{display:none}.row2{grid-template-columns:1fr}.secR .sort{max-width:120px}}
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="side">
    <div class="logo"><div class="mark"></div><div><b>CICI</b><small>Announcement<br>System</small></div></div>
    <nav class="nav" id="nav">
      <button data-view="all"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h5v-6h4v6h5V9.5"/></svg>Home</button>
      <button data-view="event"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg>Events</button>
      <button data-view="activity"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/></svg>Activities</button>
      <button data-view="exam"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M8 13h8M8 17h6"/></svg>Exams</button>
      <hr>
      <button data-act="notif"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 8 3 8H3s3-1 3-8"/><path d="M10 21a2 2 0 0 0 4 0"/></svg>Notifications <span class="badge" id="navBadge"></span></button>
      <button data-act="settings"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 0 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 0 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 0 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 0 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Settings</button>
    </nav>
    <div class="user">
      <button data-act="profile"><div class="avatar">PA</div><div><b>Paul Abian</b><small>Student ▾</small></div></button>
    </div>
  </aside>

  <main class="main">
    <div class="toprow" style="position:relative">
      <label class="search"><span aria-hidden="true">🔍</span><input id="search" type="search" placeholder="Search announcements, events...  ( / )" aria-label="Search"></label>
      <button class="btn primary newbtn" data-act="new" aria-label="New announcement">+ <span class="lbl">New</span></button>
      <button class="bell" data-act="notif" aria-label="Notifications">🔔<span class="badge" id="bellBadge"></span></button>
      <button class="avbtn" data-act="profile" aria-label="Profile">PA</button>
      <div class="dropdown" id="notifMenu" hidden></div>
    </div>

    <section class="hero" id="hero">
      <span class="chip" id="heroChip"></span>
      <h2 id="heroTitle"></h2>
      <p id="heroText"></p>
      <button class="cta" id="heroCta"></button>
      <div class="bldg"></div>
      <div class="mega"></div>
      <div class="dots" id="heroDots"></div>
    </section>

    <section class="quick">
      <button class="qcard" data-view="event"><div class="ico">📅</div><div><b>Events</b><small id="qEvent">Check upcoming events</small></div><span class="go">›</span></button>
      <button class="qcard" data-view="activity"><div class="ico">🏆</div><div><b>Activities</b><small id="qActivity">Join and participate</small></div><span class="go">›</span></button>
      <button class="qcard" data-view="exam"><div class="ico">📄</div><div><b>Exams</b><small id="qExam">View exam schedules</small></div><span class="go">›</span></button>
    </section>

    <div class="sec" id="updates"><h3 id="updatesTitle">Latest Updates</h3>
      <div class="secR">
        <select class="sort" id="sort" aria-label="Sort">
          <option value="soon">Soonest first</option>
          <option value="new">Newest posted</option>
          <option value="az">Title A–Z</option>
        </select>
        <button class="linkbtn" data-act="clear">See all →</button>
      </div>
    </div>
    <div class="chips" id="chips">
      <button data-view="all">All</button>
      <button data-view="event">Events</button>
      <button data-view="activity">Activities</button>
      <button data-view="exam">Exams</button>
      <button data-view="saved">★ Saved</button>
      <button data-view="mine">✓ My list</button>
    </div>
    <div class="filters" id="filters" hidden></div>
    <section class="cards" id="cards"></section>

    <footer>
      <span><b>CICI</b> &nbsp;•&nbsp; Connect. Learn. Participate.</span>
      <span>Stay informed. Stay ahead. ♡</span>
    </footer>
  </main>

  <aside class="rail">
    <div class="panel">
      <header><b>📅 Academic Calendar</b><button class="linkbtn" data-act="today">Today</button></header>
      <div class="calnav"><button data-act="prevMonth" aria-label="Previous month">‹</button><span id="monthLabel"></span><button data-act="nextMonth" aria-label="Next month">›</button></div>
      <div class="cal" id="cal"></div>
    </div>
    <div class="panel">
      <header><b>🕒 Upcoming</b><button class="linkbtn" data-act="clear">See all →</button></header>
      <div class="up" id="upcoming"></div>
    </div>
  </aside>
</div>

<div class="dropdown" id="profileMenu" hidden>
  <button class="ni" data-view="mine"><b>✓ My list</b><small>Events and activities you joined</small></button>
  <button class="ni" data-view="saved"><b>★ Saved</b><small>Announcements you bookmarked</small></button>
  <button class="ni" data-act="settings"><b>⚙ Settings</b><small>Display and data</small></button>
  <a class="ni" href="admin.html" style="color:inherit"><b>🛠 Admin panel</b><small>Manage announcements and users</small></a>
  <button class="ni" data-act="signout"><b>Sign out</b><small>Signed in as Paul Abian · Student</small></button>
</div>

<dialog id="detail"><div class="box" id="detailBody"></div></dialog>

<dialog id="formDlg">
  <form class="box" id="form" novalidate>
    <h3 id="formTitle">New announcement</h3>
    <label class="fld">Title<input name="title" maxlength="80" required></label>
    <div class="row2">
      <label class="fld">Type<select name="type"><option value="event">Event</option><option value="activity">Activity</option><option value="exam">Exam</option></select></label>
      <label class="fld">Location<input name="where" maxlength="60" placeholder="e.g. Room 105 or Online"></label>
    </div>
    <div class="row2">
      <label class="fld">Start date<input name="date" type="date" required></label>
      <label class="fld">End date (optional)<input name="end" type="date"></label>
    </div>
    <label class="fld">Details<textarea name="body" rows="3" maxlength="300"></textarea></label>
    <label class="chk"><input type="checkbox" name="pinned"> Pin to top</label>
    <div class="err" id="formErr" role="alert"></div>
    <div class="acts">
      <button type="button" class="btn" data-close>Cancel</button>
      <button type="submit" class="btn primary" id="formSubmit">Publish</button>
    </div>
  </form>
</dialog>

<dialog id="settingsDlg">
  <div class="box">
    <h3>Settings</h3>
    <label class="setrow"><span>Show welcome banner<small>The rotating banner at the top</small></span><input type="checkbox" id="setHero"></label>
    <label class="setrow"><span>Compact cards<small>Hide card images</small></span><input type="checkbox" id="setCompact"></label>
    <label class="setrow"><span>Auto-rotate banner<small>Change slide every 6 seconds</small></span><input type="checkbox" id="setRotate"></label>
    <div class="setrow"><span>Reset demo data<small>Removes your posts, saved items and sign-ups</small></span><button class="btn danger" data-act="reset">Reset</button></div>
    <div class="acts"><button class="btn primary" data-close>Done</button></div>
  </div>
</dialog>

<div id="toast" role="status" aria-live="polite"></div>

<script>
/* ---------- constants ---------- */
const TYPE = { event: 'Events', activity: 'Activities', exam: 'Exams', saved: 'Saved', mine: 'My list' };
const PILL = { event: 'Event', activity: 'Activity', exam: 'Exam' };
const TAG = { event: '', activity: 'act', exam: 'exam' };
const IMG = { event: '', activity: 'green', exam: 'paper' };
const ACTION = { event: ['Register', 'Registered ✓'], activity: ['Join', 'Joined ✓'], exam: ['Remind me', 'Reminder set ✓'] };
const HASH = { all: '', event: 'events', activity: 'activities', exam: 'exams', saved: 'saved', mine: 'mine' };

const SEED = [
  { id: 1, type: 'event', title: 'CICI Week 2026', date: '2026-11-15', end: '2026-11-21', where: 'Main Campus', pinned: true, body: 'A week of fun, learning, and community!' },
  { id: 2, type: 'activity', title: 'Green Campus Initiative', date: '2026-11-10', end: '2026-11-30', where: 'Campus Grounds', body: 'Join our tree planting activity.' },
  { id: 3, type: 'exam', title: 'Midterm Examination', date: '2026-11-20', where: 'Online', body: 'Coverage: Modules 1–5.' },
  { id: 4, type: 'activity', title: 'Activity Deadline', date: '2026-11-30', where: 'Student Affairs Office', body: 'Last day to submit your activity sign-up form.' },
  { id: 5, type: 'event', title: 'Freshmen Orientation', date: '2026-11-09', where: 'Auditorium', body: 'Welcome session, campus tour and club sign-ups.' },
  { id: 6, type: 'exam', title: 'Data Structures Quiz', date: '2026-11-12', where: 'Room 105', body: 'Chapters 4–6. Bring your student ID.' },
];

const SLIDES = [
  { chip: '📢 Latest Announcement', title: 'Welcome to CICI!', text: 'Stay updated with the latest events, activities, and exams.', cta: 'View All Announcements →', view: 'all' },
  { chip: '📅 Event', title: 'CICI Week is Coming', text: 'A week of fun, learning, and community starts November 15.', cta: 'See Events →', view: 'event' },
  { chip: '📄 Exam', title: 'Midterms Are Near', text: 'Check the exam schedule and prepare early.', cta: 'View Exams →', view: 'exam' },
];

/* ---------- storage (safe if blocked) ---------- */
const store = {
  get(k, d) { try { const v = localStorage.getItem('cici.' + k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem('cici.' + k, JSON.stringify(v)); } catch {} },
};
let custom = store.get('custom', []);
let reg = new Set(store.get('reg', []));
let saved = new Set(store.get('saved', []));
let read = new Set(store.get('read', []));
let settings = Object.assign({ hero: true, compact: false, rotate: true }, store.get('settings', {}));
const persist = () => {
  store.set('custom', custom); store.set('reg', [...reg]); store.set('saved', [...saved]);
  store.set('read', [...read]); store.set('settings', settings);
};
// Admin-managed items (admin.html writes cici.items); drafts are hidden from students.
const adminItems = () => (store.get('items', null) || SEED).filter((a) => a.status !== 'draft');
const all = () => [...adminItems(), ...custom];
const byId = (id) => all().find((a) => a.id == id);

/* ---------- state ---------- */
const now = new Date();
const TODAY = iso(now.getFullYear(), now.getMonth(), now.getDate());
let view = 'all', query = '', sort = 'soon', selectedDay = null, heroIndex = 0, editingId = null;
let calYear = now.getFullYear(), calMonth = now.getMonth();

/* ---------- helpers ---------- */
const $ = (s) => document.querySelector(s);
function iso(y, m, d) { return `${y}-${String(m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`; }
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const D = (s) => new Date(s + 'T00:00:00');
const fmt = (s, o) => D(s).toLocaleDateString(undefined, o);
const fmtLong = (a) => a.end && a.end !== a.date ? `${fmt(a.date, { month: 'short', day: 'numeric' })} – ${fmt(a.end, { month: 'short', day: 'numeric', year: 'numeric' })}` : fmt(a.date, { month: 'short', day: 'numeric', year: 'numeric' });
const fmtShort = (a) => {
  if (!a.end || a.end === a.date) return fmt(a.date, { month: 'short', day: 'numeric' });
  const sameMonth = a.date.slice(0, 7) === a.end.slice(0, 7);
  return `${fmt(a.date, { month: 'short', day: 'numeric' })} – ${sameMonth ? D(a.end).getDate() : fmt(a.end, { month: 'short', day: 'numeric' })}`;
};
const endOf = (a) => a.end || a.date;
const covers = (a, day) => a.date <= day && endOf(a) >= day;
const daysUntil = (s) => Math.round((D(s) - D(TODAY)) / 86400000);
const when = (a) => {
  if (covers(a, TODAY)) return 'Happening now';
  const n = daysUntil(a.date);
  return n < 0 ? 'Ended' : n === 0 ? 'Today' : n === 1 ? 'Tomorrow' : `In ${n} days`;
};

let toastTimer;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2400);
}
function closeMenus() { $('#notifMenu').hidden = true; $('#profileMenu').hidden = true; }

/* ---------- notifications: anything starting within 14 days, or that you posted ---------- */
function notifications() {
  return all().filter((a) => (daysUntil(a.date) >= 0 && daysUntil(a.date) <= 14) || covers(a, TODAY) || a.own)
    .sort((a, b) => a.date.localeCompare(b.date));
}

/* ---------- filtering ---------- */
function filtered() {
  const q = query.trim().toLowerCase();
  const list = all()
    .filter((a) => view === 'all' || (view === 'saved' ? saved.has(a.id) : view === 'mine' ? reg.has(a.id) : a.type === view))
    .filter((a) => !q || [a.title, a.body, a.where, PILL[a.type]].join(' ').toLowerCase().includes(q))
    .filter((a) => !selectedDay || covers(a, selectedDay));
  const cmp = {
    soon: (a, b) => (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0) || a.date.localeCompare(b.date),
    new: (a, b) => b.id - a.id,
    az: (a, b) => a.title.localeCompare(b.title),
  }[sort];
  return list.sort(cmp);
}

/* ---------- render ---------- */
function renderHero() {
  const s = SLIDES[heroIndex];
  $('#heroChip').textContent = s.chip; $('#heroTitle').textContent = s.title;
  $('#heroText').textContent = s.text; $('#heroCta').textContent = s.cta; $('#heroCta').dataset.view = s.view;
  $('#heroDots').innerHTML = SLIDES.map((_, i) => `<button class="${i === heroIndex ? 'on' : ''}" data-dot="${i}" aria-label="Slide ${i + 1}"></button>`).join('');
}

function renderQuick() {
  const count = (t) => all().filter((a) => a.type === t && endOf(a) >= TODAY).length;
  $('#qEvent').textContent = `${count('event')} upcoming events`;
  $('#qActivity').textContent = `${count('activity')} open activities`;
  $('#qExam').textContent = `${count('exam')} scheduled exams`;
}

function actionBtn(a, cls = '') {
  const on = reg.has(a.id);
  return `<button class="btn ${on ? 'done' : 'primary'} ${cls}" data-act="reg" data-id="${a.id}">${ACTION[a.type][on ? 1 : 0]}</button>`;
}

function renderCards() {
  const list = filtered();
  $('#updatesTitle').textContent = view === 'all' ? 'Latest Updates' : TYPE[view];
  document.querySelectorAll('#chips button, #nav button[data-view]').forEach((b) => b.classList.toggle('on', b.dataset.view === view));

  const f = [];
  if (selectedDay) f.push(`<button class="fchip" data-act="clearDay">📅 ${fmt(selectedDay, { weekday: 'short', month: 'short', day: 'numeric' })} ✕</button>`);
  if (query.trim()) f.push(`<button class="fchip" data-act="clearSearch">🔍 “${esc(query.trim())}” ✕</button>`);
  $('#filters').innerHTML = f.length ? `<span class="mine">${list.length} result${list.length === 1 ? '' : 's'} ·</span>${f.join('')}<button class="linkbtn" data-act="clear">Clear all</button>` : '';
  $('#filters').hidden = !f.length;

  const emptyMsg = view === 'saved' ? 'Nothing saved yet. Tap ☆ on any announcement to save it.'
    : view === 'mine' ? 'You haven’t joined anything yet.'
    : selectedDay ? 'Nothing scheduled on this day.' : 'No announcements match.';
  $('#cards').innerHTML = list.length ? list.map((a) => `
    <article class="card">
      <div class="top">
        <span class="tag ${TAG[a.type]}">${TYPE[a.type]}</span>
        <span class="r">${a.pinned ? '<span class="pin">📌 Pinned</span>' : ''}
          <button class="star" data-act="save" data-id="${a.id}" aria-pressed="${saved.has(a.id)}" aria-label="${saved.has(a.id) ? 'Remove from saved' : 'Save'}">${saved.has(a.id) ? '★' : '☆'}</button></span>
      </div>
      <div class="img ${IMG[a.type]}"></div>
      <div class="body">
        <h4><button class="titlebtn" data-act="open" data-id="${a.id}">${esc(a.title)}</button></h4>
        <div class="meta"><span>📅 ${fmtLong(a)}</span>${a.where ? `<span>📍 ${esc(a.where)}</span>` : ''}</div>
        <p>${esc(a.body)}</p>
        <span class="mine">${when(a)}${a.own ? ' · Posted by you' : ''}</span>
      </div>
      <div class="foot">${actionBtn(a)}<button class="linkbtn" data-act="open" data-id="${a.id}">Details →</button></div>
    </article>`).join('') : `<div class="empty">${emptyMsg}</div>`;
}

function renderCal() {
  $('#monthLabel').textContent = new Date(calYear, calMonth, 1).toLocaleDateString(undefined, { month: 'long', year: 'numeric' });
  const first = new Date(calYear, calMonth, 1).getDay();
  const days = new Date(calYear, calMonth + 1, 0).getDate();
  const marks = new Set(); all().forEach((a) => { marks.add(a.date); marks.add(endOf(a)); });
  let html = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].map((d) => `<span class="dow">${d}</span>`).join('');
  for (let i = 0; i < first; i++) html += '<button class="blank" disabled tabindex="-1"></button>';
  for (let d = 1; d <= days; d++) {
    const k = iso(calYear, calMonth, d);
    const cls = [k === selectedDay && 'sel', k === TODAY && 'today', marks.has(k) && 'dot'].filter(Boolean).join(' ');
    const n = all().filter((a) => covers(a, k)).length;
    html += `<button class="${cls}" data-day="${k}" aria-label="${fmt(k, { month: 'long', day: 'numeric' })}${n ? `, ${n} item${n > 1 ? 's' : ''}` : ''}">${d}</button>`;
  }
  $('#cal').innerHTML = html;
}

function renderUpcoming() {
  const list = (selectedDay ? all().filter((a) => covers(a, selectedDay)) : all().filter((a) => endOf(a) >= TODAY))
    .sort((a, b) => a.date.localeCompare(b.date)).slice(0, 3);
  $('#upcoming').innerHTML = list.length ? list.map((a) => `
    <button class="it" data-act="open" data-id="${a.id}">
      <span></span>
      <div><b>${fmtShort(a)}</b><span>${esc(a.title)}</span></div>
      <span class="pill ${TAG[a.type]}">${PILL[a.type]}</span>
    </button>`).join('') : `<p class="none">${selectedDay ? 'Nothing on this day.' : 'Nothing upcoming.'}</p>`;
}

function renderNotif() {
  const list = notifications();
  const unread = list.filter((a) => !read.has(a.id)).length;
  for (const id of ['#navBadge', '#bellBadge']) { $(id).textContent = unread; $(id).hidden = !unread; }
  $('#notifMenu').innerHTML = (list.length ? list.map((a) => `
    <button class="ni" data-act="open" data-id="${a.id}" style="${read.has(a.id) ? '' : 'background:var(--blue-50)'}">
      <b>${read.has(a.id) ? '' : '● '}${esc(a.title)}</b><small>${PILL[a.type]} · ${fmtShort(a)} · ${when(a)}</small></button>`).join('')
    : '<p class="ni"><small>No notifications</small></p>')
    + (unread ? '<button class="ni" data-act="readAll" style="text-align:center;color:var(--blue);font-weight:600">Mark all as read</button>' : '');
}

function applySettings() {
  $('#app').classList.toggle('nohero', !settings.hero);
  $('#app').classList.toggle('compact', settings.compact);
  $('#setHero').checked = settings.hero; $('#setCompact').checked = settings.compact; $('#setRotate').checked = settings.rotate;
}

function renderAll() { applySettings(); renderHero(); renderQuick(); renderCards(); renderCal(); renderUpcoming(); renderNotif(); }

/* ---------- detail dialog ---------- */
function openDetail(id) {
  const a = byId(id); if (!a) return;
  read.add(a.id); persist(); renderNotif();
  $('#detailBody').innerHTML = `
    <span class="pill ${TAG[a.type]}">${PILL[a.type]}</span> <span class="mine">${when(a)}</span>
    <h3>${esc(a.title)}</h3>
    <div class="meta"><span>📅 ${fmtLong(a)}</span>${a.where ? `<span>📍 ${esc(a.where)}</span>` : ''}</div>
    <p>${esc(a.body) || '<span class="mine">No details.</span>'}</p>
    <div class="acts">
      <button class="btn" data-act="ics" data-id="${a.id}">📆 Add to calendar</button>
      <button class="btn" data-act="share" data-id="${a.id}">🔗 Copy link</button>
      <button class="btn" data-act="save" data-id="${a.id}">${saved.has(a.id) ? '★ Saved' : '☆ Save'}</button>
    </div>
    <div class="acts">
      ${a.own ? `<button class="btn danger" data-act="del" data-id="${a.id}">Delete</button><button class="btn" data-act="edit" data-id="${a.id}">Edit</button>` : ''}
      <span class="sp"></span>
      <button class="btn" data-close>Close</button>
      ${actionBtn(a)}
    </div>`;
  if (!$('#detail').open) $('#detail').showModal();
  history.replaceState(null, '', '#item-' + a.id);
}

/* ---------- form ---------- */
function openForm(a) {
  editingId = a ? a.id : null;
  const f = $('#form'); f.reset();
  $('#formTitle').textContent = a ? 'Edit announcement' : 'New announcement';
  $('#formSubmit').textContent = a ? 'Save changes' : 'Publish';
  $('#formErr').textContent = '';
  const src = a || { type: ['event', 'activity', 'exam'].includes(view) ? view : 'event', date: selectedDay || TODAY };
  for (const k of ['title', 'type', 'where', 'date', 'end', 'body']) f.elements[k].value = src[k] || '';
  f.elements.pinned.checked = !!src.pinned;
  if ($('#detail').open) $('#detail').close();
  $('#formDlg').showModal();
  f.elements.title.focus();
}

$('#form').addEventListener('submit', (e) => {
  e.preventDefault();
  const f = e.target.elements;
  const d = { title: f.title.value.trim(), type: f.type.value, where: f.where.value.trim(), date: f.date.value, end: f.end.value, body: f.body.value.trim(), pinned: f.pinned.checked };
  if (!d.title) return ($('#formErr').textContent = 'Please add a title.');
  if (!d.date) return ($('#formErr').textContent = 'Please choose a start date.');
  if (d.end && d.end < d.date) return ($('#formErr').textContent = 'End date can’t be before the start date.');
  if (!d.end || d.end === d.date) delete d.end;
  if (editingId) custom = custom.map((a) => (a.id === editingId ? { ...a, ...d } : a));
  else custom.push({ id: Date.now(), own: true, ...d });
  persist(); $('#formDlg').close();
  const [y, m] = d.date.split('-').map(Number); calYear = y; calMonth = m - 1;
  renderAll(); toast(editingId ? 'Announcement updated' : 'Announcement published');
});

/* ---------- .ics download ---------- */
function downloadIcs(a) {
  const dt = (s) => s.replace(/-/g, '');
  const next = (s) => { const x = D(s); x.setDate(x.getDate() + 1); return iso(x.getFullYear(), x.getMonth(), x.getDate()); };
  const t = (s) => String(s || '').replace(/[\\,;]/g, (c) => '\\' + c).replace(/\n/g, '\\n');
  const stamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d+/, '');
  const ics = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//CICI//Announcements//EN', 'BEGIN:VEVENT',
    `UID:cici-${a.id}@cici`, `DTSTAMP:${stamp}`, `DTSTART;VALUE=DATE:${dt(a.date)}`, `DTEND;VALUE=DATE:${dt(next(endOf(a)))}`,
    `SUMMARY:${t(a.title)}`, `LOCATION:${t(a.where)}`, `DESCRIPTION:${t(a.body)}`, 'END:VEVENT', 'END:VCALENDAR'].join('\r\n');
  const url = URL.createObjectURL(new Blob([ics], { type: 'text/calendar' }));
  const link = Object.assign(document.createElement('a'), { href: url, download: a.title.replace(/[^\w]+/g, '-') + '.ics' });
  document.body.append(link); link.click(); link.remove(); setTimeout(() => URL.revokeObjectURL(url), 1000);
  toast('Calendar file downloaded');
}

async function copyLink(a) {
  const url = location.origin + location.pathname + '#item-' + a.id;
  try { await navigator.clipboard.writeText(url); toast('Link copied'); }
  catch { prompt('Copy this link:', url); }
}

/* ---------- navigation ---------- */
function setView(v, scroll = true) {
  view = v; selectedDay = null; closeMenus();
  if ($('#detail').open) $('#detail').close();
  history.replaceState(null, '', HASH[v] ? '#' + HASH[v] : location.pathname);
  renderAll();
  if (scroll) $('#updates').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function fromHash() {
  const h = location.hash.slice(1);
  const item = h.match(/^item-(\d+)$/);
  if (item) { renderAll(); openDetail(+item[1]); return; }
  const v = Object.keys(HASH).find((k) => HASH[k] && HASH[k] === h);
  view = v || 'all'; renderAll();
}

function placeMenu(menu, btn) {
  menu.hidden = false;
  const r = btn.getBoundingClientRect(), mh = menu.offsetHeight, mw = menu.offsetWidth;
  const top = r.bottom + 8 + mh > innerHeight ? r.top - mh - 8 : r.bottom + 8;
  menu.style.top = Math.max(8, top) + 'px';
  menu.style.left = Math.min(Math.max(8, r.left), innerWidth - mw - 8) + 'px';
}

/* ---------- clicks ---------- */
document.addEventListener('click', (e) => {
  const t = e.target;
  const v = t.closest('[data-view]');
  if (v) return setView(v.dataset.view);
  const dot = t.closest('[data-dot]');
  if (dot) { heroIndex = +dot.dataset.dot; return renderHero(); }
  const day = t.closest('[data-day]');
  if (day) {
    selectedDay = selectedDay === day.dataset.day ? null : day.dataset.day;
    renderCal(); renderUpcoming(); renderCards();
    if (selectedDay && innerWidth > 1100) $('#updates').scrollIntoView({ behavior: 'smooth', block: 'start' });
    return;
  }
  if (t.closest('[data-close]')) { t.closest('dialog').close(); return; }

  const btn = t.closest('[data-act]');
  if (!btn) { if (!t.closest('.dropdown')) closeMenus(); return; }
  const a = btn.dataset.id ? byId(btn.dataset.id) : null;

  switch (btn.dataset.act) {
    case 'open': closeMenus(); return openDetail(btn.dataset.id);
    case 'reg': {
      const on = !reg.has(a.id); on ? reg.add(a.id) : reg.delete(a.id); persist();
      toast(on ? { event: `Registered for ${a.title}`, activity: `Joined ${a.title}`, exam: `Reminder set for ${a.title}` }[a.type]
        : { event: 'Registration cancelled', activity: 'You left this activity', exam: 'Reminder removed' }[a.type]);
      renderCards(); if ($('#detail').open) openDetail(a.id); return;
    }
    case 'save': {
      const on = !saved.has(a.id); on ? saved.add(a.id) : saved.delete(a.id); persist();
      toast(on ? 'Saved' : 'Removed from saved'); renderCards(); if ($('#detail').open) openDetail(a.id); return;
    }
    case 'ics': return downloadIcs(a);
    case 'share': return copyLink(a);
    case 'edit': return openForm(a);
    case 'del':
      if (!confirm(`Delete “${a.title}”?`)) return;
      custom = custom.filter((x) => x.id !== a.id); reg.delete(a.id); saved.delete(a.id); persist();
      $('#detail').close(); renderAll(); return toast('Announcement deleted');
    case 'new': closeMenus(); return openForm();
    case 'notif': {
      const m = $('#notifMenu'); const show = m.hidden; closeMenus(); m.hidden = !show;
      if (show && btn.closest('.nav')) $('.toprow').scrollIntoView({ behavior: 'smooth' });
      return;
    }
    case 'readAll': notifications().forEach((x) => read.add(x.id)); persist(); renderNotif(); return toast('All caught up');
    case 'profile': { const m = $('#profileMenu'); const show = m.hidden; closeMenus(); if (show) placeMenu(m, btn); return; }
    case 'settings': closeMenus(); applySettings(); return $('#settingsDlg').showModal();
    case 'signout': closeMenus(); return toast('Sign-in isn’t set up yet — this is a demo');
    case 'reset':
      if (!confirm('Reset all your posts, saved items and sign-ups?')) return;
      custom = []; reg = new Set(); saved = new Set(); read = new Set(); settings = { hero: true, compact: false, rotate: true };
      persist(); $('#settingsDlg').close(); setView('all', false); return toast('Demo data reset');
    case 'today':
      calYear = now.getFullYear(); calMonth = now.getMonth(); selectedDay = TODAY;
      renderCal(); renderUpcoming(); renderCards(); return;
    case 'prevMonth': if (--calMonth < 0) { calMonth = 11; calYear--; } return renderCal();
    case 'nextMonth': if (++calMonth > 11) { calMonth = 0; calYear++; } return renderCal();
    case 'clearDay': selectedDay = null; renderCal(); renderUpcoming(); return renderCards();
    case 'clearSearch': query = ''; $('#search').value = ''; return renderCards();
    case 'clear': query = ''; $('#search').value = ''; return setView('all');
  }
});

/* ---------- inputs ---------- */
$('#search').addEventListener('input', (e) => { query = e.target.value; renderCards(); });
$('#sort').addEventListener('change', (e) => { sort = e.target.value; renderCards(); });
$('#setHero').addEventListener('change', (e) => { settings.hero = e.target.checked; persist(); applySettings(); });
$('#setCompact').addEventListener('change', (e) => { settings.compact = e.target.checked; persist(); applySettings(); });
$('#setRotate').addEventListener('change', (e) => { settings.rotate = e.target.checked; persist(); });
document.querySelectorAll('dialog').forEach((d) => d.addEventListener('click', (e) => { if (e.target === d) d.close(); }));
$('#detail').addEventListener('close', () => { if (location.hash.startsWith('#item-')) history.replaceState(null, '', HASH[view] ? '#' + HASH[view] : location.pathname); });
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeMenus();
  if (e.key === '/' && !e.target.closest('input, textarea, select') && !document.querySelector('dialog[open]')) { e.preventDefault(); $('#search').focus(); }
});
window.addEventListener('hashchange', fromHash);
window.addEventListener('storage', (e) => { if (e.key === 'cici.items') renderAll(); });
window.addEventListener('resize', closeMenus);

let paused = false;
$('#hero').addEventListener('mouseenter', () => (paused = true));
$('#hero').addEventListener('mouseleave', () => (paused = false));
setInterval(() => { if (settings.rotate && settings.hero && !paused && !document.hidden) { heroIndex = (heroIndex + 1) % SLIDES.length; renderHero(); } }, 6000);

fromHash();
</script>
</body>
</html>
